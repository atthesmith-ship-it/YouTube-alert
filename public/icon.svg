<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="100%" stop-color="#B3001B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Radar pulse waves -->
  <circle cx="256" cy="256" r="180" stroke="white" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="12 16"/>
  <circle cx="256" cy="256" r="140" stroke="white" stroke-opacity="0.25" stroke-width="6"/>

  <!-- YouTube Play badge centered with bell alert notch -->
  <g filter="url(#shadow)">
    <!-- Play button shape -->
    <rect x="116" y="156" width="280" height="200" rx="56" fill="white"/>
    <path d="M228 210L316 256L228 302V210Z" fill="#FF0033"/>
  </g>

  <!-- Alert Badge top right -->
  <circle cx="380" cy="136" r="44" fill="#0F172A" stroke="white" stroke-width="8"/>
  <path d="M380 114V138M380 152V154" stroke="#FACC15" stroke-width="7" stroke-linecap="round"/>
</svg>
